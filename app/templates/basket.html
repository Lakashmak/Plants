{% extends "base.html" %}
{% block content %}

    <div class="h-auto pt-[30px]">
        {% for data in basket_data %}
            <div class="m-auto block w-[650px] h-[150px] p-[15px] border border-black border-b-[7px] border-r-[3px] mt-[10px] text-[16pt] rounded-[25px] bg-[#7f7f7f] font-['Roboto']">
                <img src="{{ data.product.image.url }}" class='prod-image'>
                <div class='prod-text'>
                    <h2>{{ data.product.name }}</h2>
                    <span>${{ data.product.price }}</span>
                    <form method='POST'>
                        {% csrf_token %}
                        <input type='number' name="quantity[{{ data.product.id }}]" value="{{ data.quantity }}" onchange='this.form.submit()'>
                    </form>
                </div>
            </div>
        {% endfor %}
    </div>
    <a href="{% url 'checkout_page' %}"><input type='submit' value='ПОДТВЕРДИТЬ ПОКУПКУ' class="p-[5px] border-[5px] border-[#619648] rounded-[25px] bg-white text-[12pt] cursor-pointer focus:outline-none font-['Roboto'] mt-[5px] hover:border-white hover:bg-[#7f7f7f] hover:text-white"></a>

{% endblock %}
